services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: books-lending-platform
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/LMS
      DB_USERNAME: lms_user
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: LMS
      MYSQL_USER: lms_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./lms.sql:/docker-entrypoint-initdb.d/lms.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
